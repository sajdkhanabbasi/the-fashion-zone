<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Orders | Climax Fashion Zone</title>
<style>
:root{--plum:#2b1238;--bg:#f7f1fa;--gold:#f5b13d;--rose:#e8456b;--ink:#1e1126;--mute:#6d5e78;--line:#e3d7ea;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
header{background:var(--plum);color:#fff;padding:16px 20px;font-family:var(--serif);font-style:italic;font-size:1.3rem}
main{max-width:900px;margin:0 auto;padding:20px}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input{flex:1;min-width:160px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff}
button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;background:var(--plum);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--plum);border:1.5px solid var(--line)}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin-bottom:12px;color:var(--mute)}
.msg.err{color:#c0283f}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top b{font-family:var(--serif);font-size:1.1rem}
.top span{color:var(--mute);font-size:.88rem}
.row{color:var(--ink);font-size:.95rem}
.row small{color:var(--mute)}
.acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.acts a{text-decoration:none;font-weight:700;font-size:.9rem;padding:7px 14px;border-radius:999px;background:var(--gold);color:var(--plum)}
.acts a.w{background:#25d366;color:#fff}
.acts{align-items:center}
button{min-height:42px;line-height:1.2;white-space:nowrap}
input:not([type=checkbox]){min-height:42px}
select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;min-height:42px;flex:1 1 auto}
input.cod{min-height:34px}
.btns button{flex:1 1 auto}
.acts2{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.acts2 button{min-height:38px}
.codl{white-space:nowrap}
.acts button{padding:7px 14px;font-size:.9rem}
.codl{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--mute)}
input.cod{flex:none;min-width:0;width:90px;padding:6px 8px}
input.sel{flex:none;min-width:0;width:18px;height:18px;padding:0}
#printArea{display:none}
@page{size:A4;margin:10mm}
@media print{
  header,main{display:none!important}
  body{background:#fff}
  #printArea{display:grid;gap:0;font-family:Arial,Helvetica,sans-serif;color:#000}
  #printArea[data-size="a6"]{grid-template-columns:repeat(2,95mm);grid-auto-rows:138mm;font-size:13pt}
  #printArea[data-size="a5"]{grid-template-columns:190mm;grid-auto-rows:138mm;font-size:13pt}
  .lbl{border:1px dashed #000;padding:4mm 5mm;overflow:hidden;box-sizing:border-box;break-inside:avoid;page-break-inside:avoid}
  .lcod{border:2px solid #000;padding:1.5mm 2mm;margin-bottom:3mm;text-align:center}
  .lcl{font-size:.9em;font-weight:700;letter-spacing:.08em}
  .lca{font-size:2.2em;font-weight:800;line-height:1.1}
  .lt{font-size:.85em;font-weight:700;letter-spacing:.1em}
  .ln{font-size:1.8em;font-weight:800;line-height:1.15}
  .lp{font-size:1.6em;font-weight:800;margin:.5mm 0 2mm}
  .la{font-size:1.25em;line-height:1.3}
  .lc{font-size:1.6em;font-weight:800;margin:1.5mm 0 3mm}
  .lprod{font-size:.95em;border-top:1px dashed #000;padding-top:1.5mm}
  .lf{font-size:.8em;margin-top:2mm}
}
</style>
</head>
<body>
<header>Climax Fashion Zone | Orders</header>
<main>
  <form class="bar" id="f">
    <input id="code" type="password" placeholder="Secret code" autocomplete="off" aria-label="Secret code">
    <button type="submit" id="go">Show orders</button>
  </form>
  <p class="msg" id="msg" role="status">Enter your secret code to see the orders.</p>
  <div id="tools" hidden>
    <div class="bar"><input id="q" placeholder="Search name, phone or city" aria-label="Search orders"></div>
    <div class="bar btns"><button type="button" class="alt" id="re">Refresh</button><button type="button" class="alt" id="all">Select all</button><select id="sz" aria-label="Label size"><option value="a6" selected>Label: quarter A4 (A6, 4 per page)</option><option value="a5">Label: half A4 (A5, 2 per page)</option></select><button type="button" id="prn">Print selected labels (0)</button></div>
    <div class="sum" id="sum"></div>
  </div>
  <div id="list"></div>
</main>
<div id="printArea"></div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzhSKDeXf1uvD0Ev5YHi6VwPas3UDcsBtpXmv4oEmbhGAtZlXVCajSH_bj9zPIpCYw/exec";
let ROWS=[],HEAD=[],CODE="",ENTRIES=[];
const $=s=>document.querySelector(s);
const money=n=>"Rs "+Number(n||0).toLocaleString("en-US");
function wa(p){let d=String(p).replace(/\D/g,"");if(d.startsWith("0"))d="92"+d.slice(1);return "https://wa.me/"+d}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function render(){
  const q=$("#q").value.trim().toLowerCase(),list=$("#list");list.textContent="";
    let shown=0,total=0;ENTRIES=[];updCount();
  ROWS.forEach(r=>{
    if(r[1]==="Name")return;
    const o={date:r[0],name:r[1],phone:r[2],city:r[3],addr:r[4],prod:r[5],note:r[6],qty:r[7],tot:r[9],st:r[10]};
    if(q&&!(String(o.name)+" "+o.phone+" "+o.city+" "+o.addr).toLowerCase().includes(q))return;
    shown++;total+=Number(o.tot)||0;
    const c=el("div","card"),t=el("div","top");
    t.append(el("b","",o.name||"(no name)"),el("span","",o.date?new Date(o.date).toLocaleString("en-GB"):""));
    c.append(t,
      el("div","row",o.prod+" x "+o.qty+"  |  "+money(o.tot)+(o.note?"  |  "+o.note:"")),
      el("div","row","City: "+(o.city||"-")),
      el("div","row","Address: "+(o.addr||"(not given)")),
      el("div","row","Phone: "+(o.phone||"-")));
    const a=el("div","acts"),call=el("a","","Call"),w=el("a","w","WhatsApp");
    call.href="tel:"+String(o.phone).replace(/[^\d+]/g,"");w.href=wa(o.phone);w.target="_blank";w.rel="noopener";
    a.append(call,w);
    const chk=document.createElement("input");chk.type="checkbox";chk.className="sel";
    const sl=el("label","codl","");sl.append(chk,document.createTextNode(" Select"));
    const codIn=document.createElement("input");codIn.type="number";codIn.min="0";codIn.className="cod";codIn.value=Number(o.tot)||0;codIn.setAttribute("aria-label","Cash to collect in rupees");
    const cl=el("label","codl","Cash to collect Rs");cl.append(codIn);
    const pb=el("button","alt","Print label");pb.type="button";
    chk.addEventListener("change",updCount);const entry={o,chk,codIn};ENTRIES.push(entry);
    pb.addEventListener("click",()=>printLabels([entry]));
    const a2=el("div","acts2");a2.append(sl,cl,pb);c.append(a,a2);list.append(c);
  });
  $("#sum").textContent="";
  $("#sum").append(el("span","","Orders: "+shown),el("span","","Total: "+money(total)));
  if(!shown)list.append(el("p","msg","No orders to show yet."));
}
function updCount(){$("#prn").textContent="Print selected labels ("+ENTRIES.filter(e=>e.chk.checked).length+")"}
function printLabels(list){
  if(!list.length){alert("Select at least one order first.");return}
  const area=$("#printArea");area.textContent="";area.dataset.size=$("#sz").value;
  list.forEach(({o,codIn})=>{
    const cod=Number(codIn.value)||0,l=el("div","lbl");
    l.append(
      cod>0?(()=>{const b=el("div","lcod");b.append(el("div","lcl","CASH ON DELIVERY"),el("div","lca",money(cod)));return b})():el("div","lcod","NO CASH TO COLLECT"),
      el("div","lt","DELIVER TO"),
      el("div","ln",o.name||""),
      el("div","lp",o.phone||""),
      el("div","la",o.addr||"(address not given)"),
      el("div","lc",String(o.city||"").toUpperCase()),
      el("div","lprod",(o.prod||"")+" x "+(o.qty||1)),
      el("div","lf","FROM: Climax Fashion Zone, Muzaffarabad AJK | WhatsApp 0337 5940711"));
    area.append(l);
  });
  window.print();
}
async function load(){
  const msg=$("#msg"),btn=$("#go");
  CODE=$("#code").value.trim();
  if(!CODE){msg.className="msg err";msg.textContent="Please enter your secret code.";return}
  btn.disabled=true;msg.className="msg";msg.textContent="Loading...";
  try{
    const res=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"list",code:CODE})});
    const data=await res.json();
    if(!data.ok){msg.className="msg err";msg.textContent=data.error==="denied"?"Wrong code.":"Could not read the Sheet. Check the script.";return}
    HEAD=data.head;ROWS=data.rows;
    msg.textContent="";$("#tools").hidden=false;render();
  }catch(e){
    msg.className="msg err";msg.textContent="Could not reach the order system. Check your internet or VPN and try again.";
  }finally{btn.disabled=false}
}
$("#f").addEventListener("submit",e=>{e.preventDefault();load()});
$("#re").addEventListener("click",load);
$("#all").addEventListener("click",()=>{const on=ENTRIES.some(e=>!e.chk.checked);ENTRIES.forEach(e=>e.chk.checked=on);updCount()});
$("#prn").addEventListener("click",()=>printLabels(ENTRIES.filter(e=>e.chk.checked)));
$("#q").addEventListener("input",render);
</script>
</body>
</html>
